  :root{
    --o:#F54128;   /* arancio */
    --k:#000000;   /* nero */
    --w:#FFFFFF;   /* bianco */
    --font:"Autoscape",system-ui,sans-serif;
    --w-text:140;   /* un solo peso per tutti i testi (come i titoli) */
    --w-bold:140;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--o)}
  body{
    overflow:hidden; overscroll-behavior:none;
    font-family:var(--font); font-weight:var(--w-text); color:var(--k);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  button{font-family:inherit; font-weight:inherit; outline:none; -webkit-appearance:none; appearance:none; color:inherit}
  button:focus, button:focus-visible{outline:none}

  /* =========================================================
     AREA DI GIOCO: tutto lo schermo (rispettando notch e bordi dell'iPhone)
     ========================================================= */
  .app{
    position:fixed;
    top:env(safe-area-inset-top); right:env(safe-area-inset-right);
    bottom:env(safe-area-inset-bottom); left:env(safe-area-inset-left);
    container-type:size;
  }
  .app *{
    --m:     clamp(12px, 3.2cqmin, 30px);                      /* margine dai bordi */
    --btn:   clamp(44px, min(12cqmin, 7.5cqw), 96px);          /* pulsanti tondi in alto */
    --edge:  calc(var(--m) + var(--btn) * .1);                 /* distanza dal bordo di lettera e scritte in basso */
    --top:   calc(var(--m) * 1.8 + var(--btn) * 1.5);          /* sotto la lettera */
    --fs:    clamp(12px, min(3.6cqh, 1.75cqw), 16px);          /* un'unica dimensione per tutti i testi */
    --ptop:  calc(var(--m) * 3 + var(--btn) * 1.53);         /* inizio del pannello: più staccato dalla lettera */
    --status:calc(var(--edge) + var(--fs) * 1.3 + var(--m) * .3);  /* spazio riservato alla riga in basso */
    --len:   max(120px, min(calc(100cqh - var(--top) - var(--status) - var(--m)), 38cqw, 480px));
    --thk:   calc(var(--len) * .42);
    --mid-y: calc((100cqh + var(--top) - var(--status)) / 2);
    --h:     clamp(25px, min(6.6cqh, 5cqw), 46px);             /* altezza pulsanti rettangolari */
    --g:     clamp(4px, 1.1cqmin, 10px);                       /* spazio tra pulsanti */
    --rows:  2;                                                /* righe delle strisce del display */
    --tile:  clamp(26px, min(7.7cqh, 4.6cqw), 60px);               /* tessere del display */
    --cell:  clamp(20px, min(6.2cqh, 4cqw), 46px);               /* griglia per disegnare */
  }

  /* ---------- in alto: [regolazioni]   A   [bluetooth] ---------- */
  .round{
    position:absolute; top:var(--m);
    width:var(--btn); height:var(--btn); border-radius:50%;
    border:0; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--k);
    transition:background .2s, color .2s, transform .08s;
  }
  .round svg{width:60%; height:60%; overflow:visible}
  .title{cursor:pointer}
  .round:active{transform:scale(.9)}
  .set{left:var(--m)}
  .bt{right:var(--m)}
  .app[data-bt="wait"] .bt svg{animation:blink .7s steps(2) infinite}
  .app[data-bt="on"] .bt,
  .app.panel-open .set{background:var(--k); color:var(--o)}
  @keyframes blink{50%{opacity:.25}}

  .title{
    position:absolute; left:50%; top:calc(var(--m) + var(--btn) * .8);
    transform:translate(-50%,-50%);
    margin:0; font-size:calc(var(--btn) * 1.95); line-height:1; font-weight:var(--w-bold);
  }

  /* ---------- in basso: messaggi e avvisi, stesso margine della lettera ---------- */
  .status{
    position:absolute; left:50%; bottom:calc(var(--edge) - 2px); transform:translateX(-50%);
    margin:0; width:max-content; max-width:calc(100% - 2 * var(--m) - 2 * var(--btn));
    text-align:center; font-size:var(--fs); line-height:1.1;
    transition:opacity .2s;
  }
  .status:empty{opacity:0}

  /* ---------- levette a pillola (gas a sinistra o a destra) ---------- */
  .zone{position:absolute; top:var(--top); bottom:0; width:50%; touch-action:none; cursor:grab}
  .zone:active{cursor:grabbing}
  .zone.gas{left:0} .zone.ste{right:0}
  .app.mancino .zone.gas{left:auto; right:0}
  .app.mancino .zone.ste{right:auto; left:0}
  .track{
    position:absolute; top:var(--mid-y);
    border-radius:999px;
    border:calc(var(--thk) * .14) solid var(--k); background:var(--o);
    transform:translate(-50%,-50%); pointer-events:none;
  }
  .track.v{left:25%; width:var(--thk); height:var(--len)}
  .track.h{left:75%; width:var(--len); height:var(--thk)}
  .app.mancino .track.v{left:75%}
  .app.mancino .track.h{left:25%}
  .knob{
    position:absolute; left:50%; top:50%;
    width:calc(var(--thk) * .58); height:calc(var(--thk) * .58);
    border-radius:50%; background:var(--k);
    transform:translate(-50%,-50%); transition:transform .14s ease-out;
  }
  .knob.drag{transition:none}

  /* ---------- pannello regolazioni ---------- */
  .panel{
    position:absolute; left:var(--m); right:var(--m); top:var(--ptop); bottom:var(--status);
    display:none; flex-direction:column; gap:calc(var(--m) * 1.7);
  }
  .app.panel-open .panel{display:flex}
  .app.panel-open .zone,
  .app.panel-open .track{display:none}

  /* pulsanti rettangolari: bianchi con testo nero; selezionati neri con testo arancio */
  .b{
    min-width:0; height:var(--h); padding:0 calc(var(--g) * 1.2); border:0; border-radius:0; cursor:pointer;
    font-size:var(--fs); line-height:1.1; letter-spacing:0; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:var(--w); color:var(--k);
    display:flex; align-items:center; justify-content:center;
    transition:background .12s, color .12s, transform .08s;
  }
  .b:active{transform:scale(.96)}
  .b.sel{background:var(--k); color:var(--o)}

  .tabs{display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--g); width:min(100%, 480px); margin:0 auto; flex:none}

  .content{flex:1; min-height:0; overflow:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch}
  .page{display:none; width:min(100%, 1000px); margin:0 auto}
  .page.sel{display:flex; flex-direction:column; gap:calc(var(--m) * 1.1)}
  .sec{display:flex; flex-direction:column; gap:calc(var(--g) * 1.2); min-width:0}
  .sec h3{margin:0; font-size:var(--fs); font-weight:var(--w-bold); line-height:1.1}
  .grid{display:grid; gap:calc(var(--g) * .8)}
  .g6{grid-template-columns:repeat(6, minmax(0, 1fr))}
  .g14{grid-template-columns:repeat(14, minmax(0, 1fr))}

  /* colori dei fari */
  .sw{
    position:relative; height:var(--h); border:0; border-radius:0; padding:0; cursor:pointer;
    transition:transform .08s;
  }
  .sw:active{transform:scale(.92)}
  .sw.sel::after{content:""; position:absolute; left:50%; top:50%; width:30%; aspect-ratio:1; transform:translate(-50%,-50%); background:var(--k)}
  .sw.dark.sel::after{background:var(--w)}
  .sw.custom{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); overflow:hidden}
  .sw.custom input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0}

  /* display: tutto in una schermata, due colonne */
  #page-display{width:100%}
  #page-display.sel{display:grid; grid-template-columns:1fr auto; column-gap:calc(var(--g) * 4); align-items:start}
  .col{display:flex; flex-direction:column; gap:calc(var(--g) * 1.6); min-width:0}
  .tiles{
    display:grid; grid-template-rows:repeat(var(--rows), var(--tile)); grid-auto-columns:var(--tile);
    gap:calc(var(--g) * .9); overflow-x:auto; overflow-y:hidden; touch-action:pan-x;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain;
  }
  .tiles::-webkit-scrollbar{display:none}
  @container (min-height: 800px){ .app * { --rows: 3 } }
  .tiles.more{-webkit-mask-image:linear-gradient(to right, #000 88%, transparent); mask-image:linear-gradient(to right, #000 88%, transparent)}
  .tile{
    width:100%; aspect-ratio:1; border:0; border-radius:0; cursor:pointer;
    padding:16%; background:var(--w);
    display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr);
    gap:5%; transition:transform .08s;
  }
  .tile:active{transform:scale(.9)}
  .tile i{border-radius:50%; background:rgba(0,0,0,.1)}
  .tile i.on{background:var(--k)}
  .tile.sel{background:var(--k)}
  .tile.sel i{background:rgba(245,65,40,.25)}
  .tile.sel i.on{background:var(--o)}
  .draw{display:grid; grid-template-columns:repeat(5, var(--cell)); gap:calc(var(--g) * .7)}
  .cell{width:var(--cell); height:var(--cell); border:0; border-radius:0; padding:0; cursor:pointer; background:var(--w)}
  .cell.on{background:var(--k)}
  .col .b{align-self:stretch}

  /* impostazioni */
  #page-imp.sel{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); max-width:960px; gap:calc(var(--g) * 1.8) calc(var(--g) * 4); align-content:start}
  /* schermi stretti (telefoni piccoli): effetti su 3 righe, impostazioni su 2 colonne */
  @container (max-width: 860px){
    .g6{grid-template-columns:repeat(4, minmax(0, 1fr))}
    #page-imp.sel{grid-template-columns:repeat(2, minmax(0, 1fr))}
  }
  .seg .b{padding:0 8px}
  .seg{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); gap:var(--g)}
  .credits{
    display:none; position:absolute; left:var(--m); bottom:calc(var(--m) - 1px);
    margin:0; max-width:calc(100% - 2 * var(--m)); font-size:var(--fs); line-height:1.1;
  }
  .credits .sep{display:inline-block; margin:0 .7em}
  /* se la riga non ci sta, i crediti vanno uno sotto l'altro, sempre in basso a sinistra */
  @container (max-width: 1100px){
    .credits .part{display:block}
    .credits .sep{display:none}
  }
  .app.panel-open.tab-imp .credits{display:block}
  .app.panel-open.tab-imp .status{display:none}

  /* ---------- telefono in verticale: il controller appare già girato in orizzontale ---------- */
  @media (orientation: portrait) and (max-width: 600px){
    .app{
      right:auto; bottom:auto;
      top:env(safe-area-inset-top);
      left:calc(100vw - env(safe-area-inset-right));
      width:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      width:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      height:calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
      transform-origin:0 0; transform:rotate(90deg);
    }
    /* le strisce e il pannello si possono scorrere anche col controller girato */
    .tiles, .content{touch-action:auto}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .app[data-bt="wait"] .bt svg{animation:none; opacity:.5}
  }
</style>
</head>
<body>

<div class="app" id="app" data-bt="off">

  <!-- in alto a sinistra: regolazioni -->
  <button class="round set" id="set" aria-label="Settings" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18"/>
      <circle cx="8" cy="6" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="12" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="10" cy="18" r="2.4" fill="currentColor" stroke="none"/>
    </svg>
  </button>

  <!-- lettera del giocatore (la manda il robot) -->
  <h1 class="title" id="letter" aria-live="polite">A</h1>

  <!-- in alto a destra: Bluetooth -->
  <button class="round bt" id="bt" aria-label="Connect Bluetooth">

  <!-- levetta sterzo: sinistra / destra -->
  <div class="zone ste" id="zoneSte" aria-label="Steering"></div>

  <!-- pannello regolazioni -->
  <div class="panel" id="panel">
    <div class="tabs" role="tablist">
      <button class="b sel" role="tab" data-tab="fari">Lights</button>
      <button class="b" role="tab" data-tab="display">Display</button>
      <button class="b" role="tab" data-tab="imp">Settings</button>

      <div class="page sel" id="page-fari">

        </div>
        <div class="col">

          <button class="b" id="clear">Clear</button>
        </div>

  <!-- in basso: messaggi e avvisi -->

<script>
const $ = id => document.getElementById(id);
const app = $('app'), btBtn = $('bt'), statusEl = $('status'), letterEl = $('letter');

/* piccola memoria del browser (può non esserci: in quel caso si ignora) */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* impostazioni salvate */
const opt = Object.assign({ speed: 100, sens: 1, hand: 'dx', invert: false, lum: 100, wake: true }, store.get('opzioni', {}));
function saveOpt() { store.set('opzioni', opt); }
function applyHand() { app.classList.toggle('mancino', opt.hand === 'sx'); }
applyHand();

/* =========================================================
   RIGA IN BASSO: avvisi fissi (browser) e messaggi brevi
   ========================================================= */
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua);
let baseNote = '';
if (!navigator.bluetooth) {
  if (isIOS)          baseNote = 'On iPhone and iPad, open this page in the Bluefy app';
  else if (isAndroid) baseNote = 'On Android, open this page in Google Chrome or Microsoft Edge';
  else                baseNote = 'For Bluetooth, use Google Chrome or Microsoft Edge';
}
statusEl.textContent = baseNote;

let toastTimer;
function toast(t, ms = 1800) {
  statusEl.textContent = t;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { statusEl.textContent = baseNote; }, ms);
}

/* =========================================================
   LETTERA DEL GIOCATORE: la manda il robot (riga GIOCATORE nel suo programma)
   ========================================================= */
function setLetter(l) {
  letterEl.textContent = l;
  letterEl.setAttribute('aria-label', 'Player ' + l);
  store.set('lettera', l);
}
setLetter(store.get('lettera', 'A'));

let idTimer = null;
function letterFromOrder(name) {
  const list = store.get('robots', []);
  if (!list.includes(name)) { list.push(name); store.set('robots', list); }
  return String.fromCharCode(65 + (list.indexOf(name) % 26));
}

/* =========================================================
   BLUETOOTH (servizio UART della micro:bit)
   ========================================================= */
const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
let device = null, rxChar = null, connecting = false;
let busy = false, pending = null;
const textQueue = [];

function setState(s) {
  app.dataset.bt = s;
  btBtn.setAttribute('aria-label', s === 'on' ? 'Disconnect Bluetooth' : 'Connect Bluetooth');
}

async function connect() {
  if (!navigator.bluetooth) { toast(baseNote, 3500); return; }
  if (rxChar) { disconnect(); return; }
  if (connecting) return;
  connecting = true;
  setState('wait');
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BBC micro:bit' }],
      optionalServices: [UART_SERVICE]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    const chars   = await service.getCharacteristics();
    rxChar = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
    if (!rxChar) throw new Error('UART non trovato');
    const txChar = chars.find(c => c.properties.indicate || c.properties.notify);
    if (txChar) {
      await txChar.startNotifications();
      txChar.addEventListener('characteristicvaluechanged', onRobotData);
    }
    setState('on');
    toast('Connected to ' + (device.name || 'robot'), 3000);
    send(0, 0, true);
    sendText('CIAO#');                 // chiede la lettera del giocatore
    sendText(`LUM:${opt.lum}#`);       // manda la luminosità salvata
    const name = device.name || device.id;
    clearTimeout(idTimer);
    idTimer = setTimeout(() => setLetter(letterFromOrder(name)), 1500);
  } catch (e) {
    setState('off');
    if (e.name !== 'NotFoundError') toast('Bluetooth error', 2500);
    console.warn(e);
  } finally {
    connecting = false;
  }
}

function disconnect() {
  send(0, 0, true);
  setTimeout(() => { if (device && device.gatt.connected) device.gatt.disconnect(); }, 150);
}

function onDisconnected() {
  rxChar = null;
  setState('off');
  toast('Disconnected');
}

/* messaggi che arrivano DAL robot */
let incoming = '';
function onRobotData(e) {
  incoming += new TextDecoder().decode(e.target.value);
  let i;
  while ((i = incoming.indexOf('#')) >= 0) {
    const msg = incoming.slice(0, i).trim();
    incoming = incoming.slice(i + 1);
    let m;
    if ((m = /^ID:([A-Za-z0-9])$/.exec(msg))) { clearTimeout(idTimer); setLetter(m[1].toUpperCase()); }
  }
}
/* velocità "sinistro,destro#": spedite quando cambiano o ogni 200 ms mentre si muove */
let lastMsg = '', lastSendTime = 0;
function send(l, r, force = false) {
  const msg = `${l},${r}#`;
  const now = performance.now();
  const moving = l !== 0 || r !== 0;
  if (!force && msg === lastMsg && !(moving && now - lastSendTime > 200)) return;
  lastMsg = msg; lastSendTime = now;
  pending = msg;
  pump();
}

/* comandi di testo: hanno la precedenza */
function sendText(t, quiet = false) {
  if (!rxChar) { if (!quiet) toast('Connect the robot first'); return; }
  textQueue.push(t);
  pump();
}

async function pump() {
  if (busy || !rxChar) return;
  let msg;
  if (textQueue.length) msg = textQueue.shift();
  else if (pending) { msg = pending; pending = null; }
  else return;
  busy = true;
  try {
    const data = new TextEncoder().encode(msg);
    if (rxChar.properties.writeWithoutResponse) await rxChar.writeValueWithoutResponse(data);
    else await rxChar.writeValue(data);
  } catch (e) {
    console.warn('Errore invio', e);
  }
  busy = false;
  if (pending || textQueue.length) pump();
}

btBtn.addEventListener('click', connect);

/* =========================================================
   PANNELLO REGOLAZIONI
   ========================================================= */
const setBtn = $('set');
function openPanel(open) {
  app.classList.toggle('panel-open', open);
  setBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  setBtn.setAttribute('aria-label', open ? 'Back to the controls' : 'Settings');
  if (open) stopAll();
}
setBtn.addEventListener('click', () => openPanel(!app.classList.contains('panel-open')));
letterEl.addEventListener('click', () => openPanel(false));      // toccando la lettera si torna alle levette

document.querySelectorAll('.tabs .b').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tabs .b').forEach(x => x.classList.toggle('sel', x === t));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('sel', p.id === 'page-' + t.dataset.tab));
    app.classList.toggle('tab-imp', t.dataset.tab === 'imp');
  });
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function selectOnly(group, btn) { group.forEach(x => x.classList.toggle('sel', x === btn)); }

/* ---------- FARI ---------- */

const COLORS = [
  ['Red', 255, 0, 0],     ['Orange', 255, 80, 0],  ['Yellow', 255, 200, 0],

const colorButtons = [];
COLORS.forEach(([name, r, g, b]) => {
  const s = el('button', 'sw' + (name === 'Off' ? ' dark' : ''));
  s.style.background = `rgb(${r},${g},${b})`;

custom.title = 'Any colour';
custom.setAttribute('aria-label', 'Any colour');

picker.type = 'color'; picker.value = '#ff1478';
picker.addEventListener('input', () => {

colorButtons.forEach(c => c.addEventListener('click', () => {
  const cur = effectButtons.findIndex(b => b.classList.contains('sel'));

// lettere dell'alfabeto
const LETTERS = {

// numeri e animazioni: generati insieme al programma del robot, così sono identici
const ANIMS = [
  {"name":"Fireworks","ms":150,"frames":[4096,469440,33080895,0]},

const DIGITS = [6595878, 14815428, 15767815, 6590735, 9413964, 16268351, 15251592, 1118495, 15252014, 2243118];

function maskOf(rows) {
  const bits = rows.replace(/\s+/g, '');
  let m = 0;
  for (let i = 0; i < 25; i++) if (bits[i] === '1') m += 2 ** i;
  return m;
}
function paint(tile, mask) {
  [...tile.children].forEach((d, i) => d.classList.toggle('on', !!((mask >> i) & 1)));
}
function makeTile(mask, name) {
  const t = el('button', 'tile');
  for (let i = 0; i < 25; i++) t.appendChild(el('i'));
  paint(t, mask);
  t.setAttribute('aria-label', name); t.title = name;
  return t;
}

const tiles = [];
function activate(t) { selectOnly(tiles, t); }

ICONS.forEach(([name, rows]) => {
  const mask = maskOf(rows);
  const t = makeTile(mask, name);
  t.addEventListener('click', () => { sendText(`PIX:${mask}#`); activate(t); });
  tiles.push(t); $('icons').appendChild(t);
});
DIGITS.forEach((mask, n) => {
  const t = makeTile(mask, 'Number ' + n);
  t.addEventListener('click', () => { sendText(`PIX:${mask}#`); activate(t); });
  tiles.push(t); $('icons').appendChild(t);
});

// strisce: due righe che scorrono di lato; sfumatura a destra se c'è dell'altro da vedere
function setupStrip(el) {
  const cols = () => {
    const rows = parseInt(getComputedStyle(el).getPropertyValue('--rows')) || 2;
    el.style.gridTemplateColumns = `repeat(${Math.ceil(el.children.length / rows)}, var(--tile))`;
  };
  const upd = () => { cols(); el.classList.toggle('more', el.scrollLeft + el.clientWidth < el.scrollWidth - 2); };
  el.addEventListener('scroll', upd, { passive: true });
  el.addEventListener('wheel', e => {               // rotella del mouse = scorrimento di lato
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
  new ResizeObserver(upd).observe(el);
  upd();
}
setupStrip($('icons'));
setupStrip($('anims'));

  c.addEventListener('click', () => { c.classList.toggle('on'); sendDrawing(); });

function drawingMask() { return cells.reduce((m, c, i) => m + (c.classList.contains('on') ? 2 ** i : 0), 0); }

/* =========================================================
   LE DUE LEVETTE A PILLOLA
   gas: solo su/giù   ·   sterzo: solo sinistra/destra
   ========================================================= */
// telefono in verticale: il controller è girato di 90°
const girataMQ = matchMedia('(orientation: portrait) and (max-width: 600px)');
const girato = () => girataMQ.matches;

function makeStick(zoneId, trackId, knobId, asse) {
  const zone = $(zoneId), track = $(trackId), knob = $(knobId);
  const s = { v: 0, id: null };
  const travel = () => Math.abs(track.clientHeight - track.clientWidth) / 2;
  s.draw = () => {
    const t = travel();
    const dx = asse === 'x' ? s.v * t : 0;
    const dy = asse === 'y' ? -s.v * t : 0;
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  };
  const move = e => {
    const r = track.getBoundingClientRect();
    const t = travel();
    let dx = e.clientX - (r.left + r.width / 2);     // spostamento del dito sullo schermo
    let dy = e.clientY - (r.top + r.height / 2);
    if (girato()) [dx, dy] = [dy, -dx];             // controller girato: si scambiano gli assi
    const v = asse === 'x' ? dx / t : -dy / t;
    s.v = Math.max(-1, Math.min(1, v));
    s.draw();
  };
  s.reset = () => { s.id = null; s.v = 0; knob.classList.remove('drag'); s.draw(); };
  zone.addEventListener('pointerdown', e => {
    if (s.id !== null) return;
    e.preventDefault();
    s.id = e.pointerId;
    try { zone.setPointerCapture(e.pointerId); } catch (err) {}
    knob.classList.add('drag');
    move(e);
  });
  zone.addEventListener('pointermove', e => { if (e.pointerId === s.id) move(e); });
  const end = e => { if (e.pointerId === s.id) s.reset(); };
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  return s;
}
const gas    = makeStick('zoneGas', 'trackGas', 'knobGas', 'y');
const sterzo = makeStick('zoneSte', 'trackSte', 'knobSte', 'x');

/* =========================================================
   TASTIERA (PC)
   W/S o frecce su/giù = gas · A/D o frecce sinistra/destra = sterzo
   R regolazioni · B Bluetooth · Spazio stop · Esc chiude
   ========================================================= */
const keys = { up: false, down: false, left: false, right: false };
const keyMap = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
                 ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); stopAll(); return; }
  if (e.code === 'Escape') { openPanel(false); return; }
  if (e.repeat) { if (keyMap[e.code]) e.preventDefault(); return; }
  if (e.code === 'KeyB') { connect(); return; }
  if (e.code === 'KeyR') { openPanel(!app.classList.contains('panel-open')); return; }
  const k = keyMap[e.code];
  if (k && !app.classList.contains('panel-open')) { e.preventDefault(); keys[k] = true; }
});
document.addEventListener('keyup', e => {
  const k = keyMap[e.code];
  if (k) { e.preventDefault(); keys[k] = false; }
});

function stopAll() {
  for (const k in keys) keys[k] = false;
  gas.reset(); sterzo.reset();
  send(0, 0, true);
}
window.addEventListener('blur', stopAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
window.addEventListener('orientationchange', stopAll);

/* =========================================================
   GUIDA
   GAS:    distanza dal centro = velocità, su = avanti, giù = indietro
   STERZO: distanza dal centro = quanto curva
   - gas senza sterzo        -> dritto, le due ruote identiche
   - gas + un po' di sterzo  -> curva morbida (la ruota interna rallenta)
   - gas + sterzo a fondo    -> curva stretta (la ruota interna si ferma)
   - solo sterzo, gas fermo  -> gira su se stesso
   ========================================================= */
const DEAD    = 0.10;
const FULL    = 0.95;
const MIN_PWR = 20;      // potenza minima (%) perché i motori si muovano davvero

function curva(v) {
  const a = Math.abs(v);
  if (a < DEAD) return 0;
  return Math.sign(v) * Math.min(1, (a - DEAD) / (FULL - DEAD));
}
function sensibilita(s) {           // dolce: sterza meno · forte: sterza prima
  if (opt.sens === 0) return s * 0.6;
  if (opt.sens === 2) return Math.sign(s) * Math.sqrt(Math.abs(s));
  return s;
}
function power(v) {                 // da -1..1 a percentuale, con la velocità massima scelta
  if (Math.abs(v) < 0.01) return 0;
  const p = MIN_PWR + (100 - MIN_PWR) * Math.min(1, Math.abs(v));
  return Math.sign(v) * Math.round(p * opt.speed / 100);
}
function computeSpeeds() {
  let t = curva(gas.v);
  let s = sensibilita(curva(sterzo.v));
  if (t === 0 && s === 0) {
    t = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
    s = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * (t !== 0 ? 0.5 : 1);
  }
  let l, r;
  if (t === 0) { l = s; r = -s; }
  else {
    const interna = t * (1 - Math.abs(s));
    if (s < 0) { l = interna; r = t; }
    else       { l = t; r = interna; }
  }
  if (opt.invert) [l, r] = [r, l];
  return { l: power(l), r: power(r) };
}

setInterval(() => {
  if (app.classList.contains('panel-open')) return;
  const { l, r } = computeSpeeds();
  send(l, r);
}, 50);

/* =========================================================
   SCHERMO INTERO, SENZA BARRA DEL BROWSER
   I browser permettono lo schermo intero solo dopo un tocco o un clic:
   per questo entra in schermo intero al primo tocco su qualsiasi punto,
   e ci rientra da solo se si esce.
   ========================================================= */
const root = document.documentElement;
const isStandalone = navigator.standalone === true ||
  matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function lockLandscape() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
}
function goFull(e) {
  applyWake();
  if (isStandalone || isFull()) return;
  if (e && e.type === 'keydown' && (e.key === 'Escape' || e.key === 'F11')) return;
  // il Bluetooth e il colore libero hanno bisogno del tocco per aprire la loro finestra: lì non lo usiamo
  if (e && e.target && e.target.closest && e.target.closest('#bt, input')) return;
  try {
    const p = root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' })
            : root.webkitRequestFullscreen ? root.webkitRequestFullscreen() : null;
    if (p && p.then) p.then(lockLandscape).catch(() => {}); else lockLandscape();
  } catch (err) {}
}
['pointerup', 'touchend', 'keydown'].forEach(ev =>
  document.addEventListener(ev, goFull, { capture: true, passive: true }));

/* "Aggiungi alla schermata Home": si apre già a schermo intero e in orizzontale (Android e iPhone) */
(async function setupHomeScreenApp() {
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#F54128'; x.fillRect(0, 0, 512, 512);
    x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '140 340px "Autoscape", system-ui, sans-serif';
    x.fillText(letterEl.textContent || 'A', 256, 272);
    const icon = c.toDataURL('image/png');
    $('touchIcon').href = icon;
    const here = location.href.split('#')[0];
    const manifest = {
      name: 'Robot Controller', short_name: 'Robot',
      start_url: here, scope: here.replace(/[^/]*$/, ''),
      display: 'fullscreen', display_override: ['fullscreen', 'standalone'],
      orientation: 'landscape', background_color: '#F54128', theme_color: '#F54128',
      icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }]
    };
    $('manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  } catch (e) {}
})();

/* schermo sempre acceso mentre si gioca (se il browser lo permette) */
let wakeLock = null;
async function applyWake() {
  try {
    if (opt.wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      if (!wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } else if (wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', applyWake);
applyWake();

document.addEventListener('dblclick', e => e.preventDefault());
